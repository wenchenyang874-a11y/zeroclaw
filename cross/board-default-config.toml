# ── 三级提示词匹配（默认开启）─────────────────────────────────────
# install.sh 安装时会用 sed 把 __MODEL_PATH__ 替换成实际部署的 gguf 路径。
# 不想用 prompt_cache 把 enabled 改成 false 即可。
[prompt_cache]
enabled    = true
db_path    = "__ZC_HOME__/data/l2_vector.db"
model_path = "__MODEL_PATH__"
model_id   = "bge-small-zh-v1.5-q4_k_m"
pooling    = "cls"
n_ctx      = 64
n_threads  = 2
accept     = 0.66
reject     = 0.54

# 自学习闭环（V6 即时学习）：L3 工具调用成功 → record_learning 即时 confirm
# → PromotionWorker 下一轮 tick（最长 promote_poll_secs 秒）拉云端生成 regex →
# 验证通过即 hot-reload 到内存 L1，无需重启进程。
learning_enabled    = true
promote_threshold_n = 1          # 首次成功就送 worker（即时学习，不再等"两次出现"）
promote_poll_secs   = 60         # 后台扫描间隔（秒）
regret_keywords     = ["不对", "取消", "算了", "不是这个意思", "错了", "不要"]

# ── Fastpath L1 ──────────────────────────────────────────────────────
# 正则匹配 → 直调工具，跳过 LLM。规则存 sqlite，独立于 prompt-cache。
# 首次启动自动 seed 工厂规则到 system namespace。
[string_match]
enabled              = true
namespace            = "default"
db_path              = "__ZC_HOME__/data/l1_string_match.db"
allow_factory_seed   = true

# ── aidetect / get_frame 工具 ──────────────────────────────────────────
# enabled=true：v0.1.9 起组合调用改走 pipeline（execute_pipeline 只能调"已注册"的工具，
# 故这俩必须 true）。snap_detect skill 引导 LLM 用 execute_pipeline 把它们组成两步，
# 不再用 shell 串调裸 binary（shell 路线 v0.1.6–v0.1.8，已被 pipeline 取代）。
[aidetect]
enabled     = true
binary_path = "__ZC_HOME__/tools/aidetect/sample_aidetect"
models_dir  = "__ZC_HOME__/tools/aidetect/models"
image_path  = "__ZC_HOME__/tools/aidetect/data/hvf_image_hor_1920x1080.yuv"
image_size  = "1920x1080"

[get_frame]
enabled     = true
binary_path = "__ZC_HOME__/tools/get_frame/hi3516cv610_get_frame"
