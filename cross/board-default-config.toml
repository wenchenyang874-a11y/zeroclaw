# zeroclaw 板上默认配置（含 prompt_cache 开关）
#
# 来源：摘自一份 onboard 后的真实板上 config.toml，prompt_cache 段已开启 + 调通
# 占位符（install.sh 安装时会用 sed 替换）：
#   __ZC_HOME__          zeroclaw 数据根目录（= $HOME/.zeroclaw，板上 /root/.zeroclaw）
#                        DB / 模型 / 工具统一在此目录下，便于管理（见
#                        doc/3layers_sdk/架构设计/多工具组合调用-skill+shell方案.md §3.①）
#   __MODEL_PATH__       gguf 模型在板上的路径（= __ZC_HOME__/models/bge-...gguf）
#
# api_key 留空——provider 验证通过靠 `model` 字段（见 zeroclaw-config schema.rs:10150）。
# 真要让 L3 兜底走云端 deepseek 把 api_key 填进去；不走 L3 留空即可（L1/L2 命中不触发它）。

schema_version = 2

[providers]
fallback = "custom:https://api.deepseek.com"

[providers.models."custom:https://api.deepseek.com"]
api_key = "sk-620d3a80b7ca4e73b600e4e5c296e5f9"
model = "deepseek-chat"
temperature = 0.7
timeout_secs = 120
requires_openai_auth = false
merge_system_into_user = false

[observability]
backend = "none"
runtime_trace_mode = "none"
runtime_trace_path = "state/runtime-trace.jsonl"
runtime_trace_max_entries = 200

[autonomy]
# 板上 IoT 场景：受控环境，关闭所有交互式审批，让 L3 工具调用直接执行。
# 调试期需要严格模式时改成 level = "supervised" + 缩减 auto_approve 即可恢复。
level = "full"
workspace_only = false
# hi3516cv610_get_frame / sample_aidetect：板上抓帧+检测 binary，供 shell 组合调用
# （见 doc/3layers_sdk/架构设计/多工具组合调用-skill+shell方案.md）。白名单按 basename 匹配，
# 裸名即可同时覆盖绝对路径调用与裸名调用。
allowed_commands = ["git", "npm", "cargo", "ls", "cat", "grep", "find", "echo", "pwd", "wc", "head", "tail", "date", "python", "python3", "pip", "node", "chmod", "mkdir", "cp", "mv", "ln", "rm", "sh", "hi3516cv610_get_frame", "sample_aidetect"]
forbidden_paths = ["~/.ssh", "~/.gnupg", "~/.aws"]
max_actions_per_hour = 1000
max_cost_per_day_cents = 100000
require_approval_for_medium_risk = false
block_high_risk_commands = false
shell_env_passthrough = []
auto_approve = ["*"]
always_ask = []
# 运行时数据统一在 __ZC_HOME__（/root/.zeroclaw）下，"/" 已覆盖；保留 /proc /sys /dev /mnt 等系统路径
allowed_roots = ["/", "/proc", "/sys/class", "/sys/devices", "/dev", "/mnt"]
non_cli_excluded_tools = []
shell_timeout_secs = 60

[trust]
initial_score = 0.8
decay_half_life_days = 30.0
regression_threshold = 0.5
correction_penalty = 0.05
success_boost = 0.01

