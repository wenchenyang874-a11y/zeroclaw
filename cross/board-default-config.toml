# execute_pipeline：LLM 发一个 tool_call、内含多步 steps，内部顺序执行注册过的工具。
# v0.1.9 起，抓帧+检测的组合改走 pipeline（取代 shell 路线）：snap_detect skill 指示 LLM
# 用一个 execute_pipeline 调用承载 get_frame→aidetect 两步。优点：调 JSON 工具、输出结构化
# （带 summary），L1 命中经 humanize 直接出自然语言。
# allowed_tools 列出可被 pipeline 调的工具（空=全禁），且这些工具本身需 enabled=true。
