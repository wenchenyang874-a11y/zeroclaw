[package]
name = "zeroclaw-prompt-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Three-tier prompt interception (L1 FTS / L2 embedding / L3 cloud) with self-learning loop. Designed for low-RAM embedded targets (Hi3516CV610)."
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
llama-cpp-2 = { version = "0.1", default-features = false }
regex = { version = "1.10", default-features = false, features = ["std", "unicode-perl", "unicode-case"] }
rusqlite = { version = "0.37", features = ["bundled", "blob"] }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
thiserror = "1.0"
tokio = { version = "1.50", default-features = false, features = ["rt", "macros", "time"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
tracing = { version = "0.1", default-features = false }

[dev-dependencies]
tempfile = "3.26"
tokio = { version = "1.50", features = ["rt", "macros"] }

[[bin]]
name = "prompt-cache-cli"
path = "src/bin/cli.rs"

[[bin]]
name = "prompt-cache-build-db"
path = "src/bin/build_db.rs"
